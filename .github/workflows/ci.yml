name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Healthy runs take 2–4 minutes. Fail a hung job fast instead of waiting out GitHub's
    # 6-hour default (seen with the intermittent Windows harness hang, #12).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          HELIX_DEBUG_PROCESS: '1'
      - name: Dump Windows processes on failure or timeout
        if: (failure() || cancelled()) && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process |
            Select-Object ProcessId, ParentProcessId, Name, CommandLine |
            Sort-Object ProcessId |
            Format-Table -AutoSize -Wrap |
            Out-String -Width 4096
        continue-on-error: true
      - name: Dump Linux processes on failure or timeout
        if: (failure() || cancelled()) && runner.os == 'Linux'
        shell: bash
        run: ps -ef --forest
        continue-on-error: true
