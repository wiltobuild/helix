<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Helix promo stage</title>
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../../node_modules/.pnpm/@fontsource-variable+bricolage-grotesque@5.3.0/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'Plex';
        src: url('../../node_modules/.pnpm/@fontsource+ibm-plex-sans@5.3.0/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2')
          format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Plex';
        src: url('../../node_modules/.pnpm/@fontsource+ibm-plex-sans@5.3.0/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2')
          format('woff2');
        font-weight: 600;
      }
      @font-face {
        font-family: 'PlexMono';
        src: url('../../node_modules/.pnpm/@fontsource+ibm-plex-mono@5.3.0/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2')
          format('woff2');
      }
      /* Helix tokens (packages/ui/src/styles/tokens.css, dark). */
      :root {
        --bg: #070a10;
        --border-strong: #2e394a;
        --text: #e6ebf2;
        --text-2: #a6b0c0;
        --text-3: #6f7a8c;
        --claude: #d97757;
        --codex: #43c2bb;
        --orch: #e3a53f;
        --review: #a98cf7;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Plex', sans-serif;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #bg,
      #layers,
      .layer {
        position: absolute;
        inset: 0;
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 75% 70% at 50% 45%,
          transparent 55%,
          rgb(0 0 0 / 0.65) 100%
        );
        pointer-events: none;
      }
      .backdrop {
        position: absolute;
        left: -200px;
        top: 0;
      }
      /* Typography */
      .quote {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-family: 'Bricolage', sans-serif;
        font-weight: 300;
        font-size: 62px;
        letter-spacing: -0.01em;
        color: var(--text);
        text-shadow: 0 4px 40px rgb(0 0 0 / 0.6);
      }
      .quote em {
        font-style: normal;
        font-weight: 600;
        color: var(--codex);
      }
      .quote.big {
        font-size: 156px;
        font-weight: 650;
        letter-spacing: -0.035em;
        text-shadow: none;
      }
      .quote.title {
        font-size: 108px;
        font-weight: 620;
        letter-spacing: -0.03em;
      }
      .quote.title b {
        font-weight: 650;
      }
      /* Shimmering gradient text: a bright band sweeps across a teal-to-coral fill. */
      .shine {
        background-image:
          linear-gradient(100deg, transparent 35%, rgb(255 255 255 / 0.85) 50%, transparent 65%),
          linear-gradient(90deg, var(--codex), #a8dcd2 48%, var(--claude));
        background-size:
          250% 100%,
          100% 100%;
        background-position:
          var(--sx, 140%) 0,
          0 0;
        background-repeat: no-repeat;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 28px rgb(67 194 187 / 0.28));
      }
      .shine.claude {
        background-image:
          linear-gradient(100deg, transparent 35%, rgb(255 255 255 / 0.8) 50%, transparent 65%),
          linear-gradient(90deg, #f0a07f, var(--claude));
        filter: drop-shadow(0 0 28px rgb(217 119 87 / 0.3));
      }
      .shine.helix {
        background-image:
          linear-gradient(100deg, transparent 35%, rgb(255 255 255 / 0.8) 50%, transparent 65%),
          linear-gradient(90deg, #f3c26a, var(--orch));
        filter: drop-shadow(0 0 28px rgb(227 165 63 / 0.3));
      }
      .attrib {
        position: absolute;
        left: 0;
        right: 0;
        top: 880px;
        text-align: center;
        font-family: 'PlexMono', monospace;
        font-size: 24px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--text-3);
      }
      .mark {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }
      .wordmark {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-family: 'Bricolage', sans-serif;
        font-weight: 700;
        font-size: 190px;
        line-height: 1;
      }
      .wordmark span {
        background-image:
          linear-gradient(100deg, transparent 38%, rgb(255 255 255 / 0.95) 50%, transparent 62%),
          linear-gradient(180deg, #ffffff, #c9d3e0);
        background-size:
          250% 100%,
          100% 100%;
        background-repeat: no-repeat;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 40px rgb(120 200 210 / 0.25));
      }
      .tagline {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-family: 'PlexMono', monospace;
        font-size: 26px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--text-2);
      }
      .rule {
        position: absolute;
        left: 50%;
        height: 2px;
        transform: translateX(-50%);
        background: linear-gradient(90deg, transparent, var(--codex), var(--claude), transparent);
      }
      /* Footage */
      .tilt {
        position: absolute;
        transform-style: preserve-3d;
      }
      .frame {
        position: absolute;
        inset: 0;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid var(--border-strong);
        background: #0b0f16;
      }
      .frame img {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      .sweep {
        position: absolute;
        top: -20%;
        bottom: -20%;
        width: 34%;
        background: linear-gradient(100deg, transparent, rgb(255 255 255 / 0.14), transparent);
        transform: skewX(-12deg);
        pointer-events: none;
      }
      .reflection {
        position: absolute;
        inset: 0;
        background: linear-gradient(160deg, rgb(255 255 255 / 0.06), transparent 40%);
        pointer-events: none;
      }
      .chip {
        position: absolute;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgb(8 11 17 / 0.82);
        border: 1px solid var(--border-strong);
        font-family: 'PlexMono', monospace;
        font-size: 16px;
        color: var(--text-2);
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .chip.tl {
        left: 20px;
        top: 18px;
      }
      .chip.bl {
        left: 20px;
        bottom: 18px;
      }
      .chip.tr {
        right: 20px;
        top: 18px;
      }
      .chip .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--codex);
      }
      .callout {
        position: absolute;
        padding: 11px 20px;
        border-radius: 14px;
        background: rgb(8 11 17 / 0.88);
        border: 1px solid var(--border-strong);
        font-family: 'Plex', sans-serif;
        font-weight: 600;
        font-size: 27px;
        white-space: nowrap;
        display: flex;
        gap: 12px;
        align-items: center;
        box-shadow: 0 12px 40px rgb(0 0 0 / 0.5);
      }
      .callout .dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
      }
      .evidence {
        position: absolute;
        left: 300px;
        top: 96px;
        width: 1320px;
        min-height: 720px;
        padding: 52px 64px;
        border-radius: 20px;
        border: 2px solid var(--border-strong);
        background: rgb(16 21 30 / 0.9);
        box-shadow: 0 30px 80px rgb(0 0 0 / 0.55);
      }
      .evidence .eyebrow {
        font-family: 'PlexMono', monospace;
        font-size: 22px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--review);
      }
      .evidence .head {
        margin-top: 14px;
        font-family: 'Bricolage', sans-serif;
        font-weight: 600;
        font-size: 52px;
      }
      .evidence .row {
        display: flex;
        gap: 22px;
        align-items: flex-start;
        margin-top: 40px;
      }
      .evidence .row .dot {
        flex: none;
        width: 18px;
        height: 18px;
        margin-top: 14px;
        border-radius: 50%;
      }
      .evidence .what {
        font-size: 36px;
        line-height: 1.3;
      }
      .evidence .src {
        margin-top: 6px;
        font-family: 'PlexMono', monospace;
        font-size: 20px;
        color: var(--text-3);
      }
      .evidence .foot {
        margin-top: 44px;
        font-family: 'PlexMono', monospace;
        font-size: 19px;
        color: var(--text-3);
      }
      /* V.A.L.E., intake and live feed panels */
      .glass {
        position: absolute;
        inset: 0;
        border-radius: 24px;
        overflow: hidden;
        background:
          radial-gradient(120% 60% at 20% 0%, rgb(67 194 187 / 0.1), transparent 60%),
          linear-gradient(180deg, rgb(18 24 34 / 0.94), rgb(10 14 21 / 0.96));
        backdrop-filter: blur(8px);
      }
      .vale,
      .feed,
      .intake {
        position: absolute;
        inset: 0;
        overflow: hidden;
        padding: 30px 32px;
        display: flex;
        flex-direction: column;
      }
      .vhead,
      .fhead {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .orbwrap {
        position: relative;
        width: 92px;
        height: 92px;
        flex: none;
      }
      .vorb {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #ffffff 0%,
          #bff3ee 12%,
          #43c2bb 38%,
          #6c5bd8 70%,
          #1a1240 100%
        );
      }
      .vorb.small {
        position: relative;
        width: 54px;
        height: 54px;
        flex: none;
        box-shadow: 0 0 40px rgb(169 140 247 / 0.5);
      }
      .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid;
      }
      .vname {
        font-family: 'Bricolage', sans-serif;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: 0.2em;
        background: linear-gradient(90deg, #bff3ee, #a98cf7);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .vname.small {
        font-size: 30px;
      }
      .vsub {
        margin-top: 4px;
        font-family: 'PlexMono', monospace;
        font-size: 15px;
        color: var(--text-2);
      }
      .live {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid rgb(63 196 126 / 0.5);
        font-family: 'PlexMono', monospace;
        font-size: 15px;
        color: #8fe3b4;
        align-self: flex-start;
      }
      .live span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #3fc47e;
        box-shadow: 0 0 12px #3fc47e;
      }
      .wave {
        height: 110px;
        margin: 22px 0 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .wave span {
        width: 6px;
        border-radius: 3px;
      }
      .transcript {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 16px;
        overflow: hidden;
      }
      .bubble {
        max-width: 88%;
        padding: 16px 20px;
        border-radius: 18px;
        font-size: 27px;
        line-height: 1.35;
      }
      .bubble.b-vale {
        align-self: flex-start;
        background: rgb(67 194 187 / 0.1);
        border: 1px solid rgb(67 194 187 / 0.35);
      }
      .bubble.b-you {
        align-self: flex-end;
        background: rgb(217 119 87 / 0.12);
        border: 1px solid rgb(217 119 87 / 0.4);
      }
      .bubble .who {
        font-family: 'PlexMono', monospace;
        font-size: 14px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-3);
        margin-bottom: 6px;
      }
      .caret {
        display: inline-block;
        width: 3px;
        height: 1em;
        margin-left: 3px;
        vertical-align: -0.15em;
        background: var(--text-2);
      }
      .sent {
        margin-top: 10px;
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgb(67 194 187 / 0.18);
        border: 1px solid rgb(67 194 187 / 0.6);
        font-family: 'PlexMono', monospace;
        font-size: 15px;
        color: #bff3ee;
      }
      .ihead {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 18px;
      }
      .ihead .eyebrow {
        font-family: 'PlexMono', monospace;
        font-size: 16px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--codex);
      }
      .ititle {
        margin-top: 8px;
        font-family: 'Bricolage', sans-serif;
        font-weight: 600;
        font-size: 44px;
      }
      .via {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid rgb(169 140 247 / 0.6);
        font-family: 'PlexMono', monospace;
        font-size: 15px;
        color: #d4c7ff;
      }
      .via span {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff, #43c2bb 45%, #6c5bd8);
      }
      .irow {
        margin-top: 14px;
        padding: 16px 20px;
        border-radius: 14px;
        background: rgb(255 255 255 / 0.03);
      }
      .irow.pending {
        opacity: 0.45;
        box-shadow: 0 0 0 1px rgb(255 255 255 / 0.06);
      }
      .irow .q {
        font-family: 'PlexMono', monospace;
        font-size: 16px;
        color: var(--text-3);
        letter-spacing: 0.04em;
      }
      .irow .a {
        margin-top: 6px;
        font-size: 25px;
        line-height: 1.3;
      }
      .irow.pending .a {
        font-style: italic;
        color: var(--text-3);
      }
      .launch {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 18px;
        font-family: 'PlexMono', monospace;
        font-size: 18px;
        color: var(--text-2);
      }
      .launch b {
        padding: 14px 26px;
        border-radius: 12px;
        background: #23a55a;
        color: #fff;
        font-family: 'Plex', sans-serif;
        font-size: 24px;
      }
      .frow {
        display: flex;
        gap: 18px;
        align-items: flex-start;
        margin-top: 14px;
        padding: 16px 18px;
        border-radius: 14px;
        border: 1px solid rgb(255 255 255 / 0.07);
      }
      .frow .dot {
        flex: none;
        width: 14px;
        height: 14px;
        margin-top: 8px;
        border-radius: 50%;
      }
      .frow .ft {
        font-size: 24px;
        font-weight: 600;
      }
      .frow .fd {
        margin-top: 4px;
        font-size: 19px;
        color: var(--text-2);
      }
      .beams {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
      }
      /* Captions: one consistent band below the footage frame. */
      .caption {
        position: absolute;
        left: 120px;
        right: 120px;
        top: 884px;
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: 'Plex', sans-serif;
        font-size: 50px;
        line-height: 1.25;
        color: var(--text);
        text-shadow: 0 2px 16px rgb(0 0 0 / 0.8);
      }
      .caption b {
        font-weight: 600;
        color: #ffffff;
      }
      .caption b.codex {
        color: var(--codex);
      }
      .caption b.claude {
        color: var(--claude);
      }
      .caption b.helix {
        color: var(--orch);
      }
      .proof {
        position: absolute;
        right: 22px;
        top: 14px;
        font-family: 'PlexMono', monospace;
        font-size: 15px;
        color: rgb(166 176 192 / 0.55);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bg"></div>
      <div id="layers"></div>
      <div class="vignette"></div>
      <div class="caption" id="caption"></div>
      <div class="proof" id="proof"></div>
    </div>
    <script src="stage.js"></script>
  </body>
</html>
